{% extends 'base.html' %}
{% block content %}
<table class="table table-striped">
    <thead>
        <tr>
            <th>Marca</th><th>Modelo</th><th>Año</th><th>Precio</th><th>Color</th><th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for auto in autos %}
        <tr>
            <td>{{ auto.marca }}</td>
            <td>{{ auto.modelo }}</td>
            <td>{{ auto.año }}</td>
            <td>{{ auto.precio }}</td>
            <td>{{ auto.color }}</td>
            <td>
                <a href="{% url 'editar_automovil' auto.id %}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{% url 'eliminar_automovil' auto.id %}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
